name: Kanal siyahısını yenilə

on:
  schedule:
    - cron: "17 2 * * *"   # hər gün 06:17 (Bakı vaxtı)
  workflow_dispatch:        # Actions səhifəsindən əllə də işə salmaq olar

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Səs yoxlaması üçün ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Siyahını qur və linkləri yoxla
        run: python channels/build.py
      - name: Dəyişiklikləri saxla
        run: |
          git config user.name "modus-tv-bot"
          git config user.email "actions@users.noreply.github.com"
          git add playlists channels/state.json report.md
          git diff --cached --quiet || git commit -m "Kanal siyahısı: $(date -u +%Y-%m-%d)"
          git push
